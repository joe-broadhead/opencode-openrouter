name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The one required check. Its id and name are both `ci`.
  ci:
    name: ci
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER_PUBLIC || 'ubuntu-24.04') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Caches ~/.npm. The pack stage installs the stock @opencode/cli for each release in TESTED_HOSTS
          # (src/constants.ts), so that file is part of the key.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/constants.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5 # the Bun the suite and the bundle are developed on
          no-cache: true # the cached 1.4.5 toolchain restores without its binary on this runner
      # actionlint is not on the runner; install the pinned release, checked against its published checksums, so the
      # check's `lint:actions` stage runs the workflow lint here as well.
      - name: Install actionlint
        env:
          VERSION: 1.7.12
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${VERSION}"
          curl -sSfLO "${base}/actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "${base}/actionlint_${VERSION}_checksums.txt"
          grep " actionlint_${VERSION}_linux_amd64.tar.gz$" "actionlint_${VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "actionlint_${VERSION}_linux_amd64.tar.gz" actionlint
          # A writable folder on PATH: the public runner has no passwordless sudo, and a stock runner needs none.
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 actionlint "$RUNNER_TEMP/bin/actionlint"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
      - run: npm run check
